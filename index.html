/* ══════════════════════════════════════════════════════
   PARSERS POR SISTEMA
   ══════════════════════════════════════════════════════ */
function parseDatacraft(wb, estConfig) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:""});
  // Row 0 = headers, data from row 1
  const despachos = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const litros = parseFloat(r[2])||0;
    const fecha  = String(r[19]||"");
    const hora   = String(r[20]||"");
    const cara   = parseInt(r[22])||1;
    if(litros>0){
      despachos.push({fecha,hora,litros,cara,operacion:String(r[0]||""),producto:String(r[3]||""),patente:String(r[5]||""),chofer:String(r[14]||""),cliente:String(r[17]||"")});
    }
  }
  // Map cara → tanque
  const porTanque = {};
  estConfig.tanques.forEach(tk=>{ porTanque[tk.id]=0; });
  despachos.forEach(d=>{
    const tk = estConfig.tanques.find(t=>t.caras.includes(d.cara));
    if(tk) porTanque[tk.id]=(porTanque[tk.id]||0)+d.litros;
  });
  return {despachos, porTanque, total:despachos.reduce((a,d)=>a+d.litros,0)};
}

function parseCintelink(wb, estConfig) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:""});
  // Headers en fila 14 (idx 14), datos desde 15
  const despachos = [];
  let headerRow = -1;
  for(let i=0;i<rows.length;i++){
    if(rows[i].some(c=>String(c).includes("Transacci"))){headerRow=i;break;}
  }
  if(headerRow<0) return {despachos:[],porTanque:{tk1:0},total:0};
  for(let i=headerRow+1;i<rows.length;i++){
    const r=rows[i];
    // B=idx1 txn, C=idx2 fecha, D=idx3 hora, R=idx17 cantidad, P=idx15 tanque
    const cant = parseFloat(r[17])||0;
    if(cant>0){
      despachos.push({fecha:String(r[2]||""),hora:String(r[3]||""),litros:cant,cara:parseInt(r[15])||1,operacion:String(r[1]||""),chofer:String(r[10]||""),patente:String(r[40]||"")});
    }
  }
  const porTanque={tk1:despachos.reduce((a,d)=>a+d.litros,0)};
  return {despachos,porTanque,total:despachos.reduce((a,d)=>a+d.litros,0)};
}

function parseDebo(wb, estConfig) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:""});
  // Headers en fila 6 (idx 5): Comprobante, Fecha, Cliente, Producto, Cantidad, Planilla, tk
  // Datos desde fila 7 (idx 6)
  const despachos=[];
  const porTanque={tk1:0,tk2:0};
  for(let i=6;i<rows.length;i++){
    const r=rows[i];
    if(!r[0]) continue;
    const cant=parseFloat(r[4])||0;
    if(cant<=0) continue;
    const fecha=r[1] instanceof Date?r[1].toLocaleDateString("es-AR"):String(r[1]||"");
    const comp=String(r[0]||"");
    const producto=String(r[3]||"");
    const tkNum=parseInt(r[6])||1;
    const tkId=tkNum===2?"tk2":"tk1";
    porTanque[tkId]=(porTanque[tkId]||0)+cant;
    despachos.push({fecha,hora:"",litros:cant,cara:tkNum,operacion:comp,producto,cliente:"",patente:""});
  }
  return {despachos,porTanque,total:despachos.reduce((a,d)=>a+d.litros,0)};
}

/* ══════════════════════════════════════════════════════
   PARSER ESTACIÓN CD (DEBO con Pump ID)
   Fila 1 = headers, datos desde fila 2
   Col A=Comprobante, B=Hora, C=Litros, D=Producto, E=Cliente, F=Pump ID
   Tk1 (Euro)=PumpID 2, Tk2 (Euro)=PumpID 1, Tk3 (Gasoil)=PumpID 3 y 4
   Columnas: 0=sale_id, 1=end_date, 2=end_time, 3=pump_id, 5=producto(id), 6=volume
   ══════════════════════════════════════════════════════ */
function parseDeborCD(wb, estConfig) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
  const despachos = [];
  const porTanque = {tk1:0, tk2:0, tk3:0};
  // Fila 0 = headers, datos desde fila 1
  for(let i=1; i<rows.length; i++){
    const r = rows[i];
    const litros = parseFloat(r[6])||0;   // col 6 = volume
    if(litros <= 0) continue;
    const pumpId  = parseInt(r[3])||0;    // col 3 = pump_id
    const fecha   = String(r[1]||"");     // col 1 = end_date
    const hora    = String(r[2]||"");     // col 2 = end_time
    const producto= String(r[5]||"");     // col 5 = id (producto)
    const comp    = String(r[0]||"");     // col 0 = sale_id
    let tkId = null;
    if(pumpId === 2)               tkId = "tk1";   // Pump 2 → Euro Tk1
    else if(pumpId === 1)          tkId = "tk2";   // Pump 1 → Euro Tk2
    else if(pumpId === 3 || pumpId === 4) tkId = "tk3";
    if(tkId){
      porTanque[tkId] = (porTanque[tkId]||0) + litros;
      despachos.push({fecha, hora, litros, cara:pumpId, operacion:comp, producto, cliente:"", patente:""});
    }
  }
  return {despachos, porTanque, total:despachos.reduce((a,d)=>a+d.litros,0)};
}

const GAS_URL_PLANTA="https://script.google.com/macros/s/AKfycbxi0XUb_Bj_09iqf6qxwMhKcfeKRBU7Ct_UeVPr0SnggHWfLOe-w_-_rhQh-9AakpMw/exec";

const GAS_URL_ESTACIONES="https://script.google.com/macros/s/AKfycbwOSxIfSPVAuXWKvPCm99TDwZh6AxnS_fDOhqxJZMFNxXgtN0sB35PRLFYguaq2gH6J/exec";

// Fetch despachos de una estación desde Google Sheets
async function fetchEstacion(estId){
  const sheetId=EST_SHEET_ID[estId];
  if(!sheetId) throw new Error("Estación no configurada: "+estId);
  const res=await fetch(GAS_URL_ESTACIONES+"?action=getDespachos&estacion="+sheetId+"&nocache="+Date.now());
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data=await res.json();
  if(data.error) throw new Error(data.error);
  return data; // {porTanque, total, registros}
}

// Config FIJA desde el código: pisa lo que venga guardado en el Sheet (Config) para estas estaciones.
// Para cambiar el stock inicial o la fecha de corte de CD, se cambia ACÁ y se vuelve a publicar.
const CONFIG_FIJA={
  ESTACIONCD:{fechaCorte:"2026-10-13", stockInicial:{tk1:12400,tk2:7980,tk3:4400}}, // cierre 12/10/2026

const _fijaStock=Object.fromEntries(Object.entries(CONFIG_FIJA).map(([k,v])=>[k,v.stockInicial]));

async function gasPost(payload){
  const res=await fetch(GAS_URL_PLANTA,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text=await res.text();
  try{
    const data=JSON.parse(text);
    if(data && data.error) throw new Error(data.error);
    return data;
  }catch(e){
    if(e.message && e.message.startsWith("Unexpected")) throw new Error("Respuesta no es JSON (¿doPost existe en el backend?): "+text.slice(0,120));
    throw e;
  }
}

// Compara la fecha de una fila (Date o string "YYYY-MM-DD"/"DD/MM/YYYY") contra un
// "desde" ("YYYY-MM-DD"). Sin "desde", o sin fecha parseable en la fila, no filtra
// (mismo criterio que el backend de Estaciones, para consistencia).
function _parseFechaLocal(val){
  if(!val) return null;
  if(val instanceof Date) return val;
  const s=String(val).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}
function _pasaDesdeLocal(fechaRaw,desdeStr){
  if(!desdeStr) return true;
  const f=_parseFechaLocal(fechaRaw), d=_parseFechaLocal(desdeStr);
  if(!f||isNaN(f)||!d||isNaN(d)) return true;
  return f.getTime()>=d.getTime();
}

async function fetchPlantaGranel(stockInicial, fechaCorte){
  const res=await fetch(GAS_URL_PLANTA+"?action=getAll&nocache="+Date.now());
  if(!res.ok) throw new Error("HTTP "+res.status);
  const rows=await res.json();

  const initTk1=(stockInicial?.PLANTAGRANEL?.tk1)||0;
  const initTk2=(stockInicial?.PLANTAGRANEL?.tk2)||0;
  const initTk3=(stockInicial?.PLANTAGRANEL?.tk3)||0;
  let tk1=initTk1, tk2=initTk2, tk3=initTk3;
  const despachos=[];

  // Ingresos automáticos a cada estación detectados desde los despachos de Planta
  // estacion → tanque → litros acumulados
  const ingresosAutoEst={};
  // Envíos a Estación CD (desde su fecha de corte) sin distribución por tanque: no se suman, se avisan en la tarjeta
  const sinDistCD=[];
  const diagIngresos={}; // estacion → {matches, litros, inconsistencias:[{fecha,comp,total,sumaDistribucion}]}

  rows.forEach(row=>{
    if(!row||!row[0]) return;
    const ref=String(row[2]||"").toUpperCase();
    // Sheet: col10=Factura, col11=Gasoil Tk1, col12=Euro Tk2, col13=Euro Tk3
    const v1=parseFloat(row[11])||0;
    const v2=parseFloat(row[12])||0;
    const v3=parseFloat(row[13])||0;
    const total=v1+v2+v3;
    const esIngreso=["RTO","FAC"].includes(ref);
    const receptor=String(row[6]||"").toUpperCase();
    const destino=String(row[7]||"").toUpperCase();
    const fecha=String(row[1]||"");

    // Stock propio de Planta: solo cuenta movimientos desde SU fecha de corte (si tiene una configurada).
    if(_pasaDesdeLocal(fecha, fechaCorte?.PLANTAGRANEL)){
      if(esIngreso){ tk1+=v1; tk2+=v2; tk3+=v3; }
      else { tk1-=v1; tk2-=v2; tk3-=v3; }
    }

    if(!esIngreso){
      // Detectar a qué estación fue el despacho y acumularlo como ingreso — pero
      // filtrado por la fecha de corte de ESA estación destino (no la de Planta):
      // si el envío es anterior al corte de esa estación, ya quedó absorbido en el
      // Stock Inicial que se cargó ahí, y sumarlo de nuevo lo duplicaría.
      if(total>0){
        // row[18] = distribucion JSON {"tk1":5000,"tk2":5000} o vacío
        let distribucion=null;
        try{ const raw=String(row[18]||""); if(raw.startsWith("{"))distribucion=JSON.parse(raw); }catch(e){}
        Object.entries(ESTACIONES_CONFIG).forEach(([estId,cfg])=>{
          if(estId==="PLANTAGRANEL") return;
          const match=cfg.destinos.some(d=>destino.trim()===d.toUpperCase().trim());
          if(!match) return;
          if(!_pasaDesdeLocal(fecha, fechaCorte?.[estId])) return; // anterior al corte de esa estación: ya absorbido
          if(!ingresosAutoEst[estId]) ingresosAutoEst[estId]={};
          if(!diagIngresos[estId]) diagIngresos[estId]={matches:0,litros:0,inconsistencias:[]};
          diagIngresos[estId].matches++;
          diagIngresos[estId].litros+=total;
          const sumaDist=distribucion?Object.values(distribucion).reduce((a,b)=>a+(parseFloat(b)||0),0):0;
          let distribucionFinal=null;
          if(distribucion&&sumaDist>0){
            if(Math.abs(sumaDist-total)>0.5){
              // La distribución cargada no coincide con el total real despachado: se reescala
              // proporcionalmente para conservar el reparto entre tanques, pero ajustada al total real
              // (verificado contra el tanque de Planta) — no se descarta ni se vuelca todo a un tanque.
              diagIngresos[estId].inconsistencias.push({fecha,comp:String(row[3]||""),total:Math.round(total*100)/100,sumaDistribucion:Math.round(sumaDist*100)/100});
              const factor=total/sumaDist;
              distribucionFinal={};
              Object.entries(distribucion).forEach(([tkId,lts])=>{ distribucionFinal[tkId]=(parseFloat(lts)||0)*factor; });
            } else {
              distribucionFinal=distribucion;
            }
          }
          if(distribucionFinal){
            // Distribuir por tanque según JSON guardado (ya validado/ajustado contra el total real)
            Object.entries(distribucionFinal).forEach(([tkId,lts])=>{
              const tkValido=cfg.tanques.find(t=>t.id===tkId);
              if(tkValido&&lts>0){
                ingresosAutoEst[estId][tkId]=(ingresosAutoEst[estId][tkId]||0)+(parseFloat(lts)||0);
              }
            });
          } else if(estId==="ESTACIONCD"){
            // Estación CD sin distribución: no se adivina el tanque (en Planta el producto no
            // siempre coincide con la columna), se avisa para completarla en Planta.
            sinDistCD.push({fecha,litros:total,ref:String(row[3]||"")});
          } else {
            // Sin distribución cargada: todo al primer tanque, usando el total real
            const tkDest=cfg.tanques[0].id;
            ingresosAutoEst[estId][tkDest]=(ingresosAutoEst[estId][tkDest]||0)+total;
          }
        });
      }
    }

    if(total>0){
      despachos.push({fecha,litros:total,cara:1,operacion:String(row[3]||""),receptor:String(row[6]||""),destino:String(row[7]||""),ref,v1,v2,v3});
    }
  });

  // Convertir ingresosAutoEst a formato de ingresos para la app
  const ingresosAuto=[];
  Object.entries(ingresosAutoEst).forEach(([estId,tanques])=>{
    Object.entries(tanques).forEach(([tkId,litros])=>{
      if(litros>0){
        ingresosAuto.push({
          id:"auto_"+estId+"_"+tkId,
          estacion:estId,
          tanque:tkId,
          litros,
          fecha:"auto",
          obs:"Automático desde Planta Granel",
          auto:true,
        });
      }
    });
  });

  const DESTINOS_INTERNOS=["REMOTA VH","REMOTA TP","BASE CR","RESERO","ESTACION CD","REMOTA AG","INT 742","INT 836","INT 794"];

  // Helper: filtrar despachos de Planta por mes "YYYY-MM" (fecha formato ISO "2026-04-06")
  const _mesActual=(()=>{ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`; })();
  const esMesActual=(fecha)=>{
    const s=String(fecha||"").trim();
    return s.startsWith(_mesActual);
  };

  // Despachos externos históricos (para stock)
  const despachoExterno=despachos
    .filter(d=>!["RTO","FAC"].includes(d.ref))
    .filter(d=>{ const dest=(d.receptor+" "+d.destino).toUpperCase(); return !DESTINOS_INTERNOS.some(di=>dest.includes(di)); })
    .reduce((a,d)=>a+d.litros,0);

  // Despachos externos SOLO del mes actual (para dashboard y top clientes)
  const despExternosMes=despachos
    .filter(d=>!["RTO","FAC"].includes(d.ref))
    .filter(d=>{ const dest=(d.receptor+" "+d.destino).toUpperCase(); return !DESTINOS_INTERNOS.some(di=>dest.includes(di)); })
    .filter(d=>esMesActual(d.fecha));

  const despachoExternoMes=despExternosMes.reduce((a,d)=>a+d.litros,0);
  // Días distintos con movimiento en el mes (para calcular consumo/día sobre días reales
  // de actividad, no días de calendario — Planta no trabaja sábados/domingos).
  const _diasSetPlantaMes={};
  despExternosMes.forEach(d=>{ if(d.fecha) _diasSetPlantaMes[String(d.fecha).slice(0,10)]=true; });
  const diasConMovimientoMes=Object.keys(_diasSetPlantaMes).length;

  // Top clientes externos del mes actual (excluye entregas a puntos propios)
  const mapaClientes={};
  despExternosMes.forEach(d=>{
    const cliente=(d.receptor||d.destino||"SIN NOMBRE").trim();
    if(cliente) mapaClientes[cliente]=(mapaClientes[cliente]||0)+d.litros;
  });
  const topClientesPlanta=Object.entries(mapaClientes)
    .map(([cliente,litros])=>({cliente,litros:Math.round(litros)}))
    .sort((a,b)=>b.litros-a.litros)
    .slice(0,10);

  return {
    stockVivo:{tk1:Math.max(0,tk1),tk2:Math.max(0,tk2),tk3:Math.max(0,tk3)},
    despachos,
    porTanque:{tk1:0,tk2:0,tk3:0},
    total:despachos.filter(d=>!["RTO","FAC"].includes(d.ref)).reduce((a,d)=>a+d.litros,0),
    despachoExterno,
    despachoExternoMes,
    diasConMovimientoMes,
    topClientesPlanta,
    ingresosAuto,
    diagIngresos,
    sinDistCD,
  };
}

const fmt  = n=>Math.round(n||0).toLocaleString("es-AR");
const fmtD = n=>(n||0).toFixed(1);

/* helper: mes actual como "YYYY-MM" */
function mesActual(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
}
/* label legible de un "YYYY-MM" */
function mesLabel(val){
  const [y,m]=val.split("-").map(Number);
  const d=new Date(y,m-1,1);
  const l=d.toLocaleString("es-AR",{month:"long",year:"numeric"});
  return l.charAt(0).toUpperCase()+l.slice(1);
}
/* label corto "Ene 26" para ejes de gráfico */
function mesLabelCorto(val){
  const [y,m]=val.split("-").map(Number);
  const d=new Date(y,m-1,1);
  const l=d.toLocaleString("es-AR",{month:"short",year:"2-digit"});
  return l.charAt(0).toUpperCase()+l.slice(1).replace(".","");
}
/* Extrae "YYYY-MM" de una fecha en formato ISO "yyyy-mm-dd" o "dd/mm/yyyy" (con o sin hora) */
/* Coincidencia de destino por PALABRA COMPLETA (no substring suelto).
   Evita falsos positivos como "VH" matcheando dentro de "PVH 1568" o "RED CI VH". */
function destinoCoincide(texto,alias){
  const t=String(texto||"").toUpperCase();
  const a=String(alias||"").toUpperCase().trim();
  if(!a) return false;
  // Escapar caracteres especiales de regex en el alias
  const esc=a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("(^|[^A-Z0-9])"+esc+"($|[^A-Z0-9])");
  return re.test(t);
}

function fechaAMes(raw){
  const s=String(raw||"").trim();
  if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}`;
  return null;
}

function TankGauge({nombre,stock,cap,color,idx=0,alarma=0,producto=""}){
  const pct=cap>0?Math.min(100,Math.max(0,(stock/cap)*100)):0;
  const enAlarma=alarma>0&&stock<=alarma;
  // Color por producto: Euro=verde, Gasoil=amarillo/naranja
  const prodColor=producto&&producto.toLowerCase().includes("gasoil")?"#d49010":
                  producto&&(producto.toLowerCase().includes("euro")||producto.toLowerCase().includes("diesel"))?"#16a34a":
                  color;
  const lvlColor=enAlarma?"#e03030":prodColor;
  const W=110,H=130;
  const cx=W/2,cy=52,r=42;
  const fillH=r*2*(pct/100);
  const fillY=cy+r-fillH;
  const waveAmp=3;
  const wave=pct>1&&pct<99
    ?`M${cx-r-2},${fillY} Q${cx-r/2},${fillY-waveAmp} ${cx},${fillY} Q${cx+r/2},${fillY+waveAmp} ${cx+r+2},${fillY} L${cx+r+2},${cy+r+2} L${cx-r-2},${cy+r+2} Z`
    :pct<=1?null
    :`M${cx-r-2},${cy-r-2} L${cx+r+2},${cy-r-2} L${cx+r+2},${cy+r+2} L${cx-r-2},${cy+r+2} Z`;
  const clipId=`ck-${idx}-${nombre.replace(/\s/g,"")}`;
  // litros display
  const litrosLabel=stock>=1000?(stock/1000).toFixed(1)+"k":fmt(stock);
  return(
    <div className="fu" style={{animationDelay:`${idx*0.1}s`,display:"flex",flexDirection:"column",alignItems:"center",gap:5,
      background:"#fff",borderRadius:14,padding:"12px 10px 10px",
      border:`1.5px solid ${enAlarma?"#fca5a5":pct>60?"#e2e8f0":pct>25?"#fde68a44":"#fca5a5"}`,
      boxShadow:enAlarma?"0 0 0 2px #fee2e2":"0 1px 6px rgba(0,0,0,.07)",
      minWidth:100,
    }}>
      <svg width={W} height={cy*2+4} viewBox={`0 0 ${W} ${cy*2+4}`} style={{overflow:"visible",display:"block"}}>
        <defs>
          <clipPath id={clipId}>
            <circle cx={cx} cy={cy} r={r}/>
          </clipPath>
        </defs>
        {/* background circle */}
        <circle cx={cx} cy={cy} r={r} fill="#f1f5f9"/>
        {/* liquid */}
        <g clipPath={`url(#${clipId})`}>
          {wave&&<>
            <rect x={cx-r-2} y={fillY} width={(r+2)*2} height={fillH+4} fill={`${lvlColor}22`}/>
            <path d={wave} fill={`${lvlColor}40`}/>
          </>}
        </g>
        {/* border ring */}
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={lvlColor} strokeWidth="2.5" opacity="0.7"/>
        {/* litros grandes */}
        <text x={cx} y={cy-2} textAnchor="middle" fill={lvlColor}
          style={{fontFamily:"'Bebas Neue'",fontSize:22,fontWeight:700}}>
          {litrosLabel}
        </text>
        <text x={cx} y={cy+13} textAnchor="middle" fill={lvlColor} opacity="0.75"
          style={{fontFamily:"'DM Mono'",fontSize:9}}>L</text>
        <text x={cx} y={cy+25} textAnchor="middle" fill="#94a3b8"
          style={{fontFamily:"'DM Mono'",fontSize:8}}>
          {Math.round(pct)}%
        </text>
      </svg>
      {/* label */}
      <div style={{textAlign:"center",marginTop:2}}>
        <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#64748b",letterSpacing:1,textTransform:"uppercase"}}>{nombre}</div>
        <div style={{fontFamily:"'DM Mono'",fontSize:8,color:"#cbd5e1",marginTop:1}}>cap {(cap/1000).toFixed(0)}k L</div>
      </div>
      {enAlarma&&<div style={{fontSize:9,color:"#e03030",fontWeight:700,fontFamily:"'DM Mono'",letterSpacing:1}}>⚠ ALARMA</div>}
    </div>
  );
}

  const diasConMovimiento=est==="PLANTAGRANEL" ? plantaData?.diasConMovimientoMes

    : est==="ANTICLINAL" ? clientesData?.AG_dias
    : est==="TRESPICOS" ? clientesData?.TP_dias

        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>

          </div>

            <span style={{background:`${cfg.color}18`,color:cfg.color,fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:3,fontFamily:"'DM Mono'",letterSpacing:1}}>{cfg.sistema}</span>
            <span style={{fontSize:11,color:"#94a3b8"}}>{cfg.tanques.length} tanque{cfg.tanques.length>1?"s":""} · {fmt(totalCap)} L cap.</span>
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:30,color:pctTotal>60?cfg.color:pctTotal>25?"#d49010":"#e03030",lineHeight:1}}>{fmt(totalStock)}<span style={{fontSize:13,opacity:.5,marginLeft:3}}>L</span></div>
          <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{pctTotal.toFixed(0)}% capacidad</div>

            <div style={{fontSize:9,color:"#94a3b8",letterSpacing:1.5,textTransform:"uppercase",fontFamily:"'DM Mono'"}}>{label}</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:13,fontWeight:500,color:"#334155",marginTop:3}}>{val}</div>
            <div style={{fontSize:9,color:"#cbd5e1"}}>{sub}</div>
          </div>

      </div>

      {/* upload / sincronizar */}
      <div style={{padding:"12px 20px",borderTop:"1px solid #f1f5f9",display:"flex",gap:8,alignItems:"center",background:"#fff"}}>
        {est==="PLANTAGRANEL"?(
          <>
            <button onClick={onSyncPlanta} disabled={plantaLoading} style={{flex:1,background:`${cfg.color}10`,border:`1px solid ${cfg.color}44`,borderRadius:7,color:cfg.color,fontFamily:"'DM Mono'",fontSize:11,fontWeight:500,letterSpacing:1,padding:"8px 12px",cursor:"pointer",transition:"all .2s",textTransform:"uppercase",display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:plantaLoading?.6:1}}>
              {plantaLoading?<span className="spin">⟳</span>:"↻"} Actualizar

        ):est==="BASECR"?(
          <>
            <button onClick={onSyncBaseCR} disabled={baseCRLoading} style={{flex:1,background:`${cfg.color}10`,border:`1px solid ${cfg.color}44`,borderRadius:7,color:cfg.color,fontFamily:"'DM Mono'",fontSize:11,fontWeight:500,letterSpacing:1,padding:"8px 12px",cursor:"pointer",transition:"all .2s",textTransform:"uppercase",display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:baseCRLoading?.6:1}}>
              {baseCRLoading?<span className="spin">⟳</span>:"↻"} Actualizar
            </button>
            {baseCRData&&<div style={{fontSize:10,color:"#94a3b8",fontFamily:"'DM Mono'",whiteSpace:"nowrap"}}>{baseCRData.totalMovs} mov</div>}
          </>
        ):EST_SHEET_ID[est]?(
          <>
            <button onClick={()=>onSyncEst(est)} disabled={estLoading?.[est]} style={{flex:1,background:`${cfg.color}10`,border:`1px solid ${cfg.color}44`,borderRadius:7,color:cfg.color,fontFamily:"'DM Mono'",fontSize:11,fontWeight:500,letterSpacing:1,padding:"8px 12px",cursor:"pointer",transition:"all .2s",textTransform:"uppercase",display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:estLoading?.[est]?.6:1}}>
              {estLoading?.[est]?<span className="spin">⟳</span>:"↻"} Actualizar
            </button>

          </>
        ):(
          <>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={e=>{if(e.target.files[0])onUpload(est,e.target.files[0]);e.target.value="";}}/>
            <button onClick={()=>fileRef.current.click()} style={{flex:1,background:`${cfg.color}10`,border:`1px solid ${cfg.color}44`,borderRadius:7,color:cfg.color,fontFamily:"'DM Mono'",fontSize:11,fontWeight:500,letterSpacing:1,padding:"8px 12px",cursor:"pointer",transition:"all .2s",textTransform:"uppercase",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {uploading?<span className="spin">⟳</span>:"↑"} {data?"Actualizar Excel":"Cargar Excel"}
            </button>
            {data&&<div style={{fontSize:10,color:"#94a3b8",fontFamily:"'DM Mono'",whiteSpace:"nowrap"}}>{data.despachos?.length||0} ops</div>}
          </>
        )}
      </div>
    </div>
  );
}

/* Donut de 2 segmentos en SVG puro (sin dependencias externas) */
function DonutDosSegmentos({pct,colorA,colorB,size=150,strokeWidth=24}){
  const r=(size-strokeWidth)/2;
  const circ=2*Math.PI*r;
  const cx=size/2, cy=size/2;
  const largoA=circ*(Math.max(0,Math.min(100,pct))/100);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={colorB} strokeWidth={strokeWidth}/>
      {largoA>0&&(
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={colorA} strokeWidth={strokeWidth}
          strokeDasharray={`${largoA} ${circ-largoA}`}
          transform={`rotate(-90 ${cx} ${cy})`}
          style={{transition:"stroke-dasharray .6s ease"}}/>
      )}
    </svg>
  );
}

/* Barras apiladas al 100% en SVG puro (sin dependencias externas) — evolución mensual Propio/Clientes */
function BarrasEvolucion({datos,colorA,colorB,width=280,height=170}){
  // datos: [{label, pctA, pctB, rawA, rawB}]
  const padTop=6, padBottom=22, padLeft=4, padRight=4;
  const chartH=height-padTop-padBottom;
  const n=datos.length||1;
  const gap=10;
  const barW=(width-padLeft-padRight-gap*(n-1))/n;
  const [hoverIdx,setHoverIdx]=useState(null);
  return (
    <div style={{position:"relative"}}>
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
        {datos.map((d,i)=>{
          const x=padLeft+i*(barW+gap);
          const hA=chartH*(d.pctA/100);
          const hB=chartH*(d.pctB/100);
          const yA=padTop+(chartH-hA);
          const yB=yA-hB;
          return (
            <g key={i}
              onMouseEnter={()=>setHoverIdx(i)}
              onMouseLeave={()=>setHoverIdx(null)}
              style={{cursor:"pointer"}}>
              <rect x={x} y={padTop} width={barW} height={chartH} fill="transparent"/>
              <rect x={x} y={yA} width={barW} height={hA} fill={colorA} opacity={hoverIdx===null||hoverIdx===i?1:.35} rx={2}/>
              <rect x={x} y={yB} width={barW} height={hB} fill={colorB} opacity={hoverIdx===null||hoverIdx===i?1:.35} rx={2}/>
              <text x={x+barW/2} y={height-6} textAnchor="middle" fontSize="9" fontFamily="'DM Mono'" fill="#94a3b8">{d.label}</text>
            </g>
          );
        })}
      </svg>
      {hoverIdx!==null&&(
        <div style={{position:"absolute",top:0,left:0,background:"#1e293b",color:"#fff",fontFamily:"'DM Mono'",fontSize:10,padding:"6px 10px",borderRadius:6,pointerEvents:"none",whiteSpace:"nowrap",boxShadow:"0 4px 12px rgba(0,0,0,.2)"}}>
          <div style={{fontWeight:700,marginBottom:3}}>{datos[hoverIdx].label}</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:colorA,flexShrink:0}}/>
            <span>Propio: {datos[hoverIdx].pctA.toFixed(1)}% ({fmt(datos[hoverIdx].rawA)} L)</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:colorB,flexShrink:0}}/>
            <span>Clientes: {datos[hoverIdx].pctB.toFixed(1)}% ({fmt(datos[hoverIdx].rawB)} L)</span>
          </div>
        </div>
      )}
    </div>
  );
}

function DonutGauge({value,max,color,size=120}){
  const r=48,circ=2*Math.PI*r;
  const pct=max>0?Math.min(1,value/max):0;
  const dash=pct*circ;
  return(
    <svg width={size} height={size} viewBox="0 0 120 120">
      <circle cx={60} cy={60} r={r} fill="none" stroke="#e2e8f0" strokeWidth={10}/>
      <circle cx={60} cy={60} r={r} fill="none" stroke={color} strokeWidth={10}
        strokeLinecap="round" strokeDasharray={`${dash} ${circ}`}
        transform="rotate(-90 60 60)"
        style={{transition:"stroke-dasharray .8s cubic-bezier(.4,0,.2,1)",filter:`drop-shadow(0 0 6px ${color}88)`}}/>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════
   APP PRINCIPAL
   ══════════════════════════════════════════════════════ */
function App(){
  const [dataPorEst,setDataPorEst]=useState({});
  const [ingresos,setIngresos]=useState([]);
  const [alarmas,setAlarmas]=useState({});
  const [stockInicial,setStockInicial]=useState({
    ANTICLINAL:{tk1:3933,tk2:14759},
    TRESPICOS:{tk1:9800,tk2:4800,tk3:2600},
    RESERO:{tk1:8400},
    VALLE:{tk1:16300,tk2:1000},
    PLANTAGRANEL:{tk1:26000,tk2:24000,tk3:8100},
    ESTACIONCD:{tk1:12400,tk2:7980,tk3:4400},
    BASECR:{tk1:0},
  });
  const [fechaCorte,setFechaCorte]=useState({TRESPICOS:"2026-09-01",ESTACIONCD:"2026-10-13",VALLE:"2026-09-01"});
  const [plantaData,setPlantaData]=useState(null);
  const [plantaLoading,setPlantaLoading]=useState(false);
  const [baseCRData,setBaseCRData]=useState(null);
  const [baseCRMes,setBaseCRMes]=useState(0);
  const [reseroMes,setReseroMes]=useState(0);
  const [reseroDias,setReseroDias]=useState(0);
  const [baseCRLoading,setBaseCRLoading]=useState(false);
  const [estLoading,setEstLoading]=useState({});
  const [uploading,setUploading]=useState({});
  const [toast,setToast]=useState({msg:"",type:""});
  const [tab,setTab]=useState(()=>{ const h=window.location.hash.replace("#","").toLowerCase(); return ["dashboard","despachos","propioclientes","ingresos"].includes(h)?h:"dashboard"; });
  useEffect(()=>{ window._setTab=setTab; return ()=>{ window._setTab=null; }; },[setTab]);
  const [modalIngreso,setModalIngreso]=useState(false);
  const [formIng,setFormIng]=useState({estacion:"ANTICLINAL",tanque:"tk1",litros:"",fecha:new Date().toISOString().slice(0,10),obs:""});
  const [detalleEst,setDetalleEst]=useState(null);
  const [clientesData,setClientesData]=useState(null);
  const [loadingClientes,setLoadingClientes]=useState(false);
  const [mesSeleccionado,setMesSeleccionado]=useState(mesActual);
  const [configVisible,setConfigVisible]=useState(false);
  // ── Propio Petrosar vs Clientes ──
  const [pcMes,setPcMes]=useState(mesActual);
  const [pcCache,setPcCache]=useState({}); // mes("YYYY-MM") → respuesta cruda de action=getClientes
  const [pcMesesDisponibles,setPcMesesDisponibles]=useState([]);
  const [pcLoading,setPcLoading]=useState(false);

  // Ctrl+Shift+K activa/desactiva el panel Config
  useEffect(()=>{
    const handler=(e)=>{
      if(e.ctrlKey&&e.shiftKey&&e.key==="K"){
        e.preventDefault();
        setConfigVisible(v=>!v);
      }
    };
    window.addEventListener("keydown",handler);
    return ()=>window.removeEventListener("keydown",handler);
  },[]);

  const [ultimaActualizacion,setUltimaActualizacion]=useState(null);

  const showToast=(msg,type="ok",ms=3000)=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:""}),ms);};

  // Función central de sincronización de todos los datos
  const syncTodo=React.useCallback((silencioso=false)=>{
    const si=stockInicial;
    if(!silencioso) showToast("Actualizando...","ok",1500);
    // Planta
    setPlantaLoading(true);
    fetchPlantaGranel(si, fechaCorte)
      .then(d=>{ setPlantaData(d); setIngresos(prev=>[...prev.filter(i=>!i.auto),...(d.ingresosAuto||[])]); })
      .catch(()=>{}).finally(()=>setPlantaLoading(false));
    // Base CR
    setBaseCRLoading(true);
    fetchBaseCR().then(d=>setBaseCRData(d)).catch(()=>{}).finally(()=>setBaseCRLoading(false));
    // Estaciones
    Object.keys(EST_SHEET_ID).forEach(estId=>{
      setEstLoading(p=>({...p,[estId]:true}));
      // Sin &mes= para que devuelva histórico completo — pero con &desde= si hay fecha de corte
      // configurada, para que el backend sume despachos solo desde esa fecha (necesario para stock)
      const desdeParam=fechaCorte[estId]?("&desde="+fechaCorte[estId]):"";
      const url=GAS_URL_ESTACIONES+"?action=getDespachos&estacion="+EST_SHEET_ID[estId]+desdeParam+"&nocache="+Date.now();
      fetch(url).then(r=>r.json()).then(d=>{ if(!d.error) setDataPorEst(p=>({...p,[estId]:d})); }).catch(()=>{}).finally(()=>setEstLoading(p=>({...p,[estId]:false})));
    });
    // Timestamp
    const ahora=new Date();
    setUltimaActualizacion(`${String(ahora.getHours()).padStart(2,"0")}:${String(ahora.getMinutes()).padStart(2,"0")} hs`);
  },[stockInicial,fechaCorte]);

  // Auto-sync cada 5 minutos
  useEffect(()=>{
    const interval=setInterval(()=>syncTodo(true),5*60*1000);
    return ()=>clearInterval(interval);
  },[syncTodo]);

  async function fetchClientes(mes, esFallback){
    const m=mes||mesActual();
    setMesSeleccionado(m);
    setLoadingClientes(true);
    let data=null;
    try{
      const res=await fetch(GAS_URL_ESTACIONES+"?action=getClientes&mes="+m+"&nocache="+Date.now());
      data=await res.json();
      setClientesData(data);
    }catch(e){console.error("Error clientes",e);}
    finally{setLoadingClientes(false);}
    // Si el mes pedido no tiene datos reales, caer al último mes disponible (una sola vez)
    if(!esFallback && data?.mesesDisponibles?.length && !data.mesesDisponibles.includes(m)){
      // No asumimos el orden del array (puede venir ascendente o descendente según el backend):
      // el mes más reciente es el mayor en formato "YYYY-MM", que ordena bien como string.
      const ultimo=data.mesesDisponibles.reduce((a,b)=>b>a?b:a);
      fetchClientes(ultimo, true);
    }
  }

  useEffect(()=>{ if(tab==="despachos") fetchClientes(mesActual()); },[tab]);

  // Top clientes Planta filtrado por el mes seleccionado en el selector
  const {topClientesPlantaMes, totalPlantaMes}=useMemo(()=>{
    if(!plantaData?.despachos) return {topClientesPlantaMes:[], totalPlantaMes:0};
    const DEST_INT=["REMOTA VH","REMOTA TP","BASE CR","RESERO","ESTACION CD","REMOTA AG","INT 742","INT 836","INT 794"];
    const [yy,mm]=mesSeleccionado.split("-").map(Number);
    const mapa={};
    plantaData.despachos
      .filter(d=>!["RTO","FAC"].includes(d.ref))
      .filter(d=>{ const t=d.receptor+" "+(d.destino||""); return !DEST_INT.some(x=>destinoCoincide(t,x)); })
      .filter(d=>{
        const s=String(d.fecha||"").trim();
        // ISO: 2026-04-06
        const mx=s.match(/^(\d{4})-(\d{2})/);
        if(mx) return +mx[1]===yy&&+mx[2]===mm;
        return false;
      })
      .forEach(d=>{ const c=(d.receptor||d.destino||"SIN NOMBRE").trim(); if(c) mapa[c]=(mapa[c]||0)+d.litros; });
    const entradas=Object.entries(mapa).map(([cliente,litros])=>({cliente,litros:Math.round(litros)})).sort((a,b)=>b.litros-a.litros);
    const total=entradas.reduce((s,e)=>s+e.litros,0);
    return {topClientesPlantaMes:entradas.slice(0,10), totalPlantaMes:total};
  },[plantaData,mesSeleccionado]);

  // ── Propio Petrosar vs Clientes: usa la misma acción getClientes que la solapa Despachos,
  // porque getDespachos (dataPorEst) no trae el detalle de cliente por registro, solo totales por tanque.
  // "PETROSAR" como nombre de cliente = consumo propio de flota (mismo criterio que flota_petrosar_v6).
  const PC_KEYS=[
    {key:"AG", nombre:"Anticlinal Grande", color:"#e87030"},
    {key:"TP", nombre:"Tres Picos",        color:"#3a8fd4"},
    {key:"VH", nombre:"Valle Hermoso",     color:"#8b5cf6"},
    {key:"CD", nombre:"Estación CD",       color:"#20c0a0"},
  ];
  const PC_COLOR_PROPIO="#1a5fa8", PC_COLOR_CLIENTES="#e8a020";

  const fetchPcMes=React.useCallback((mes)=>{
    setPcCache(prev=>{
      if(prev[mes]) return prev; // ya está en caché, no refetch
      return prev;
    });
    return fetch(GAS_URL_ESTACIONES+"?action=getClientes&mes="+mes+"&nocache="+Date.now())
      .then(r=>r.json())
      .then(d=>{
        setPcCache(prev=>({...prev,[mes]:d}));
        if(d.mesesDisponibles) setPcMesesDisponibles(d.mesesDisponibles);
        return d;
      })
      .catch(()=>null);
  },[]);

  // Cargar mes actual al entrar a la solapa (además de traer mesesDisponibles)
  useEffect(()=>{
    if(tab!=="propioclientes") return;
    if(!pcCache[mesActual()]){
      setPcLoading(true);
      fetchPcMes(mesActual()).finally(()=>setPcLoading(false));
    }
  },[tab]);

  // En modo torta, traer el mes seleccionado si falta
  useEffect(()=>{
    if(tab!=="propioclientes"||!pcMes||pcCache[pcMes]) return;
    setPcLoading(true);
    fetchPcMes(pcMes).finally(()=>setPcLoading(false));
  },[tab,pcMes]);

  // Ajustar pcMes a un mes con datos reales apenas conocemos mesesDisponibles
  useEffect(()=>{
    if(pcMesesDisponibles.length&&!pcMesesDisponibles.includes(pcMes)){
      setPcMes(pcMesesDisponibles.reduce((a,b)=>b>a?b:a));
    }
  },[pcMesesDisponibles]);

  // Últimos 6 meses disponibles, ordenados cronológicamente (más viejo → más nuevo)
  const pcUltimos6Meses=useMemo(()=>[...pcMesesDisponibles].sort().slice(-6),[pcMesesDisponibles]);

  // Traer en segundo plano los meses de la evolución que falten en caché
  useEffect(()=>{
    if(tab!=="propioclientes"||pcUltimos6Meses.length===0) return;
    const faltantes=pcUltimos6Meses.filter(m=>!pcCache[m]);
    faltantes.forEach(m=>fetchPcMes(m));
  },[tab,pcUltimos6Meses]);

  /* Dado el mes y el código de punto (AG/TP/VH/CD), separa propio vs clientes
     buscando dentro de la lista de clientes de ese mes la fila "PETROSAR" */
  function pcEstado(mes,key){
    const d=pcCache[mes];
    if(!d) return {propio:0,clientes:0,total:0,cargado:false};
    const lista=d[key]||[];
    const total=d[key+"_total"]||0;
    const propioItem=lista.find(it=>String(it.cliente||"").toUpperCase().includes("PETROSAR"));
    const propio=propioItem?propioItem.litros:0;
    return {propio, clientes:Math.max(0,total-propio), total, cargado:true};
  }

  // Cargar config de estaciones desde Sheets al inicio
  const [configLoaded,setConfigLoaded]=useState(false);
  const [configStatus,setConfigStatus]=useState({carga:null,guardado:null}); // {ok,msg,hora}
  useEffect(()=>{
    gasGet("getEstConfig")
      .then(cfg=>{
        if(cfg && cfg.stockInicial && Object.keys(cfg.stockInicial).length>0){
          setStockInicial(p=>({...p,...cfg.stockInicial,..._fijaStock}));
        }
        if(cfg && cfg.alarmas) setAlarmas(cfg.alarmas);
        if(cfg && cfg.fechaCorte) setFechaCorte({...cfg.fechaCorte,..._fijaCorte});
        setConfigStatus(p=>({...p,carga:{ok:true,msg:"Config cargada OK",hora:new Date().toLocaleTimeString("es-AR")}}));
      })
      .catch(err=>{
        setConfigStatus(p=>({...p,carga:{ok:false,msg:err.message,hora:new Date().toLocaleTimeString("es-AR")}}));
      })
      .finally(()=>setConfigLoaded(true)); // recién ahora es seguro dejar que el auto-guardado actúe
  },[]);

  // Carga inicial de datos — también carga clientes del mes actual para la card del dashboard
  useEffect(()=>{
    syncTodo(true);
    fetchClientes(mesActual());
  },[]);

  // Cuando clientesData resuelve el mes real (con fallback al último con datos),
  // re-sincronizamos Resero y Base CR al MISMO mes, para que la tarjeta del Dashboard
  // no mezcle meses distintos (ej. AG/TP/VH/CD de junio con Resero de julio vacío).
  useEffect(()=>{
    if(!mesSeleccionado) return;
    fetch(GAS_URL_ESTACIONES+"?action=getDespachos&estacion=RESERO&mes="+mesSeleccionado+"&nocache="+Date.now())
      .then(r=>r.json()).then(d=>{ setReseroMes(d.total||0); setReseroDias(d.dias||0); }).catch(()=>{});
    fetchBaseCRMes(mesSeleccionado).then(v=>setBaseCRMes(v)).catch(()=>{});
  },[mesSeleccionado]);

  // Guardar config automáticamente cuando cambia stockInicial, alarmas o fechaCorte
  // — pero NUNCA antes de que termine de cargar la config real (configLoaded), para no
  // pisar lo guardado con los valores por defecto al abrir la página.
  const saveEstConfigTimer=React.useRef(null);
  useEffect(()=>{
    if(!configLoaded) return;
    clearTimeout(saveEstConfigTimer.current);
    saveEstConfigTimer.current=setTimeout(()=>{
      gasPost({action:"saveEstConfig",stockInicial,alarmas,fechaCorte})
        .then(()=>setConfigStatus(p=>({...p,guardado:{ok:true,msg:"Guardado OK",hora:new Date().toLocaleTimeString("es-AR")}})))
        .catch(err=>setConfigStatus(p=>({...p,guardado:{ok:false,msg:err.message,hora:new Date().toLocaleTimeString("es-AR")}})));
    },1500); // espera 1.5s después del último cambio
  },[stockInicial,alarmas,fechaCorte,configLoaded]);

  // Sincronizar una estación manualmente
  const handleSyncEst=(estId)=>{
    setEstLoading(p=>({...p,[estId]:true}));
    const shId=EST_SHEET_ID[estId];
    const desdeParam=fechaCorte[estId]?("&desde="+fechaCorte[estId]):"";
    const url=GAS_URL_ESTACIONES+"?action=getDespachos&estacion="+shId+desdeParam+"&nocache="+Date.now();
    fetch(url).then(r=>r.json())
      .then(d=>{
        if(d.error) throw new Error(d.error);
        setDataPorEst(p=>({...p,[estId]:d}));
        showToast(`✓ ${ESTACIONES_CONFIG[estId].nombre} actualizada`,"ok");
      })
      .catch(()=>showToast(`Error al sincronizar ${ESTACIONES_CONFIG[estId].nombre}`,"err",4000))
      .finally(()=>setEstLoading(p=>({...p,[estId]:false})));
  };

  const handleSyncBaseCR=()=>{
    setBaseCRLoading(true);
    fetchBaseCR()
      .then(d=>{ setBaseCRData(d); showToast("✓ Base CR actualizada","ok"); })
      .catch(()=>showToast("Error al sincronizar Base CR","err",4000))
      .finally(()=>setBaseCRLoading(false));
  };

  // Cargar Excel de estación
  const handleUpload=useCallback(async(estId,file)=>{
    setUploading(p=>({...p,[estId]:true}));
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      const cfg=ESTACIONES_CONFIG[estId];
      const parsed=cfg.parse(wb,cfg);
      setDataPorEst(p=>({...p,[estId]:parsed}));
      showToast(`✓ ${cfg.nombre} — ${parsed.despachos.length} despachos, ${fmt(parsed.total)} L`,"ok");
    }catch(e){
      console.error(e);
      showToast(`Error al leer el archivo: ${e.message}`,"err",5000);
    }finally{
      setUploading(p=>({...p,[estId]:false}));
    }
  },[]);

  // Sincronizar Planta Granel manualmente
  const handleSyncPlanta=()=>{
    setPlantaLoading(true);
    fetchPlantaGranel(stockInicial, fechaCorte)
      .then(d=>{
        setPlantaData(d);
        setIngresos(prev=>[
          ...prev.filter(i=>!i.auto),
          ...(d.ingresosAuto||[])
        ]);
        showToast("✓ Planta Granel actualizada","ok");
      })
      .catch(()=>showToast("Error al sincronizar Planta Granel","err",4000))
      .finally(()=>setPlantaLoading(false));
  };

  // Totales globales
  const totales=useMemo(()=>{
    let totalCap=0,totalStock=0,totalDesp=0;
    Object.entries(ESTACIONES_CONFIG).forEach(([estId,cfg])=>{
      const data=estId==="PLANTAGRANEL"?plantaData:dataPorEst[estId];
      cfg.tanques.forEach(tk=>{
        totalCap+=tk.cap;
        let s=0;
        if(estId==="PLANTAGRANEL" && plantaData?.stockVivo){
          s=plantaData.stockVivo[tk.id]||0;
        } else if(estId==="BASECR" && baseCRData?.stockVivo>0){
          s=baseCRData.stockVivo;
        } else {
          const base=(stockInicial?.[estId]?.[tk.id])||0;
          const ingTotal=ingresos.filter(i=>i.estacion===estId&&i.tanque===tk.id).reduce((a,b)=>a+b.litros,0);
          const despTotal=(data?.porTanque?.[tk.id])||0;
          s=Math.max(0,base+ingTotal-despTotal);
        }
        totalStock+=s;
      });
      // Despachos: solo estaciones con datos externos (no Planta ni Base CR que duplicarían)
      // Planta suma sus despachos a clientes externos excluyendo entregas a remotas/estaciones
      if(estId==="PLANTAGRANEL" && plantaData?.despachoExterno!=null){
        totalDesp+=plantaData.despachoExterno;
      } else if(estId!=="PLANTAGRANEL" && estId!=="BASECR"){
        totalDesp+=(data?.total)||0;
      } else if(estId==="BASECR"){
        totalDesp+=(baseCRData?.totalDespachos)||0;
      }
    });
    return{totalCap,totalStock,totalDesp,pct:totalCap>0?(totalStock/totalCap*100):0};
  },[dataPorEst,ingresos,stockInicial,plantaData]);

  // Consumo por estación para gráfico
  const consumoPorEst=useMemo(()=>
    Object.entries(ESTACIONES_CONFIG).map(([id,cfg])=>({
      id,nombre:cfg.nombre,color:cfg.color,
      total: id==="PLANTAGRANEL"?(plantaData?.total||0):
             id==="BASECR"?(baseCRData?.totalDespachos||baseCRData?.stockVivo||0):
             (dataPorEst[id]?.total)||0,
      cap:cfg.tanques.reduce((a,tk)=>a+tk.cap,0),
    })).sort((a,b)=>b.total-a.total)
  ,[dataPorEst,plantaData,baseCRData]);

  const agregarIngreso=()=>{
    if(!formIng.litros||parseFloat(formIng.litros)<=0){showToast("Ingresá los litros","err");return;}
    setIngresos(p=>[...p,{...formIng,litros:parseFloat(formIng.litros),id:Date.now()}]);
    showToast(`✓ Ingreso registrado — ${fmt(formIng.litros)} L a ${ESTACIONES_CONFIG[formIng.estacion].nombre}`);
    setModalIngreso(false);
    setFormIng(p=>({...p,litros:"",obs:""}));
  };

  const inpStyle={background:"#f8fafc",border:"1.5px solid #e2e8f0",borderRadius:7,color:"#1e293b",padding:"9px 12px",fontSize:13,fontFamily:"'DM Sans'",width:"100%"};
  const lblStyle={fontSize:10,color:"#64748b",letterSpacing:1.5,marginBottom:5,display:"block",fontFamily:"'DM Mono'",textTransform:"uppercase"};

  return(
    <div style={{fontFamily:"'DM Sans'",background:"#f2f4f7",minHeight:"100vh",position:"relative",zIndex:1}}>

      {/* TOAST */}
      {toast.msg&&(
        <div style={{position:"fixed",bottom:24,right:24,background:toast.type==="ok"?"#f0fdf4":toast.type==="err"?"#fef2f2":"#eff6ff",border:`1px solid ${toast.type==="ok"?"#86efac":toast.type==="err"?"#fca5a5":"#93c5fd"}`,color:toast.type==="ok"?"#16a34a":toast.type==="err"?"#dc2626":"#1d4ed8",padding:"12px 20px",borderRadius:10,fontFamily:"'DM Mono'",fontSize:13,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,.12)",zIndex:9999,maxWidth:380}}>
          {toast.msg}
        </div>
      )}

      {/* INGRESO MODAL */}
      {modalIngreso&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={e=>{if(e.target===e.currentTarget)setModalIngreso(false);}}>
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:16,padding:28,width:380,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:22,letterSpacing:2,color:"#1e293b",marginBottom:20}}>Registrar Ingreso</div>
            <div style={{display:"grid",gap:14}}>
              <div>
                <label style={lblStyle}>Estación</label>
                <select style={inpStyle} value={formIng.estacion} onChange={e=>{const est=e.target.value;setFormIng(p=>({...p,estacion:est,tanque:ESTACIONES_CONFIG[est].tanques[0].id}));}}>
                  {Object.values(ESTACIONES_CONFIG).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
                </select>
              </div>
              {ESTACIONES_CONFIG[formIng.estacion].tanques.length>1&&(
                <div>
                  <label style={lblStyle}>Tanque</label>
                  <select style={inpStyle} value={formIng.tanque} onChange={e=>setFormIng(p=>({...p,tanque:e.target.value}))}>
                    {ESTACIONES_CONFIG[formIng.estacion].tanques.map(tk=><option key={tk.id} value={tk.id}>{tk.nombre}</option>)}
                  </select>
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div>
                  <label style={lblStyle}>Litros</label>
                  <input style={inpStyle} type="number" placeholder="0" value={formIng.litros} onChange={e=>setFormIng(p=>({...p,litros:e.target.value}))}/>
                </div>
                <div>
                  <label style={lblStyle}>Fecha</label>
                  <input style={inpStyle} type="date" value={formIng.fecha} onChange={e=>setFormIng(p=>({...p,fecha:e.target.value}))}/>
                </div>
              </div>
              <div>
                <label style={lblStyle}>Observación (opcional)</label>
                <input style={inpStyle} placeholder="Ej: RTO 12345" value={formIng.obs} onChange={e=>setFormIng(p=>({...p,obs:e.target.value}))}/>
              </div>
              <div style={{display:"flex",gap:10,marginTop:4}}>
                <button onClick={agregarIngreso} style={{flex:1,background:"#16a34a",border:"none",borderRadius:8,color:"#fff",fontFamily:"'DM Mono'",fontSize:12,letterSpacing:1,padding:"11px 0",cursor:"pointer",textTransform:"uppercase"}}>
                  ✓ Registrar
                </button>
                <button onClick={()=>setModalIngreso(false)} style={{background:"transparent",border:"1px solid #e2e8f0",borderRadius:8,color:"#64748b",fontFamily:"'DM Mono'",fontSize:12,padding:"11px 18px",cursor:"pointer"}}>✕</button>
              </div>
            </div>
          </div>
        </div>
